services:

  namenode:
    build: ./namenode
    container_name: namenode
    ports:
      - "8000:8000"
    env_file:
      - ./namenode/.env
    environment:
      # Hostnames internos Docker — usados para comunicación entre contenedores
      - DATANODES=http://datanode1:8001,http://datanode2:8001,http://datanode3:8001
      # URLs públicas EC2 devueltas al cliente en /allocate
      - PUBLIC_DATANODES=http://${PUBLIC_IP:-52.23.74.126}:8001,http://${PUBLIC_IP:-52.23.74.126}:8002,http://${PUBLIC_IP:-52.23.74.126}:8003
      - PUBLIC_NAMENODE=http://${PUBLIC_IP:-52.23.74.126}:8000
    networks:
      - dfsnet

  datanode1:
    build: ./datanode
    container_name: datanode1
    ports:
      - "8001:8001"
    environment:
      - NODE_ID=datanode1
      - NAMENODE_URL=http://namenode:8000
      - PORT=8001
      - NODE_PUBLIC_URL=http://${PUBLIC_IP:-52.23.74.126}:8001
    networks:
      - dfsnet

  datanode2:
    build: ./datanode
    container_name: datanode2
    ports:
      - "8002:8001"
    environment:
      - NODE_ID=datanode2
      - NAMENODE_URL=http://namenode:8000
      - PORT=8001
      - NODE_PUBLIC_URL=http://${PUBLIC_IP:-52.23.74.126}:8002
    networks:
      - dfsnet

  datanode3:
    build: ./datanode
    container_name: datanode3
    ports:
      - "8003:8001"
    environment:
      - NODE_ID=datanode3
      - NAMENODE_URL=http://namenode:8000
      - PORT=8001
      - NODE_PUBLIC_URL=http://${PUBLIC_IP:-52.23.74.126}:8003
    networks:
      - dfsnet

networks:
  dfsnet:
    driver: bridge
